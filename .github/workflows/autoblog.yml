name: Autoblog Pipeline

on:
  # Manual trigger — lets you test a run on demand from the Actions tab
  # without waiting for the schedule.
  workflow_dispatch: {}

  schedule:
    # Each scheduled run produces ARTICLES_PER_RUN (currently 1) article, so
    # these three entries give 3 articles/day total. To change the daily
    # count, add/remove cron+timezone pairs below (or raise ARTICLES_PER_RUN
    # instead, to produce more articles per run rather than more runs).
    #
    # timezone: uses GitHub Actions' native timezone field so Europe/Sofia
    # daylight saving (EET/EEST) is handled automatically — do NOT hardcode
    # a UTC offset here, it would drift by an hour twice a year.
    #
    # Notes:
    # - After committing, GitHub re-registers this schedule from the new file.
    # - Scheduled (cron) runs only fire from the default branch (main) —
    #   pushing this file to any other branch will not trigger runs.
    # - GitHub's scheduler can lag 5-30 minutes under load, so articles may
    #   appear slightly after the exact hour, not exactly on it.
    - cron: '0 10 * * *'
      timezone: 'Europe/Sofia'
    - cron: '0 15 * * *'
      timezone: 'Europe/Sofia'
    - cron: '0 19 * * *'
      timezone: 'Europe/Sofia'

# Prevents two runs from overlapping (e.g. a manual trigger firing while the
# scheduled run is still in progress). New runs queue rather than cancel an
# in-progress one, since cancelling mid-publish could leave a partial write.
concurrency:
  group: autoblog-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    # Non-secret pipeline behavior. Kept here (not as repository secrets) so
    # they're easy to see and change without touching GitHub's secrets UI.
    env:
      COMPLIANCE_MODE: block
      ARTICLES_PER_RUN: 1
      PUBLISH_STATUS: published
      BLOG_GID_COLLAGENLAB: gid://shopify/Blog/127520375124

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: npm run run
