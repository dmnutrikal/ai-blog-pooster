name: Autoblog Pipeline

on:
  # Manual trigger — lets you test a run on demand from the Actions tab
  # without waiting for the schedule.
  workflow_dispatch: {}

  schedule:
    # Each scheduled run produces ARTICLES_PER_RUN (currently 1) article, so
    # this single entry gives 1 article/day total. To change the daily
    # count, add/remove cron+timezone pairs below (or raise ARTICLES_PER_RUN
    # instead, to produce more articles per run rather than more runs).
    #
    # timezone: uses GitHub Actions' native timezone field so Europe/Sofia
    # daylight saving (EET/EEST) is handled automatically — do NOT hardcode
    # a UTC offset here, it would drift by an hour twice a year.
    #
    # Notes:
    # - After committing, GitHub re-registers this schedule from the new file.
    # - Scheduled (cron) runs only fire from the default branch (main) —
    #   pushing this file to any other branch will not trigger runs.
    # - GitHub's scheduler can lag 5-30 minutes under load, so articles may
    #   appear slightly after the exact hour, not exactly on it.
    - cron: '0 10 * * *'
      timezone: 'Europe/Sofia'

# Prevents two runs from overlapping (e.g. a manual trigger firing while the
# scheduled run is still in progress). New runs queue rather than cancel an
# in-progress one, since cancelling mid-publish could leave a partial write.
concurrency:
  group: autoblog-pipeline
  cancel-in-progress: false

jobs:
  # One job per store, all on the schedule above. Adding a store means: a new
  # stores/<id>/ folder (store.config.js + regulatory.js + content.js +
  # products/ — see stores/<id>/README.md), that store's secrets added to the
  # repository secrets, and a new job here. Jobs are independent: one store
  # failing never stops another.
  run-pipeline:
    runs-on: ubuntu-latest

    # Non-secret pipeline behavior. Kept here (not as repository secrets) so
    # they're easy to see and change without touching GitHub's secrets UI.
    env:
      # Selects stores/collagenlab/ — the engine resolves this store's
      # regulatory wording, product cutouts and editorial calendar from there.
      STORE: collagenlab
      COMPLIANCE_MODE: block
      ARTICLES_PER_RUN: 1
      PUBLISH_STATUS: published
      BLOG_GID_COLLAGENLAB: gid://shopify/Blog/127520375124
      STORE_PUBLIC_DOMAIN: collagenlab.bg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: npm run run

  # GutExpert — same schedule and steps as collagenlab above, different store.
  #
  # To DISABLE without editing this file: set the repository variable
  # GUTEXPERT_AUTOBLOG=off (Settings -> Secrets and variables -> Actions ->
  # Variables). Any other value, or unset, leaves it enabled.
  #
  # Also a no-op until its Shopify secrets exist: the first step checks for
  # them and every later step is skipped (job stays green) if any is missing.
  # Blog GID and public domain are hardcoded in stores/gutexpert/store.config.js.
  run-pipeline-gutexpert:
    if: vars.GUTEXPERT_AUTOBLOG != 'off'
    runs-on: ubuntu-latest

    env:
      STORE: gutexpert
      COMPLIANCE_MODE: block
      ARTICLES_PER_RUN: 1
      PUBLISH_STATUS: published

    steps:
      - name: Check GutExpert secrets
        id: secrets
        env:
          SHOPIFY_STORE_DOMAIN_GUTEXPERT: ${{ secrets.SHOPIFY_STORE_DOMAIN_GUTEXPERT }}
          SHOPIFY_CLIENT_ID_GUTEXPERT: ${{ secrets.SHOPIFY_CLIENT_ID_GUTEXPERT }}
          SHOPIFY_CLIENT_SECRET_GUTEXPERT: ${{ secrets.SHOPIFY_CLIENT_SECRET_GUTEXPERT }}
        run: |
          if [ -n "$SHOPIFY_STORE_DOMAIN_GUTEXPERT" ] && [ -n "$SHOPIFY_CLIENT_ID_GUTEXPERT" ] && [ -n "$SHOPIFY_CLIENT_SECRET_GUTEXPERT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GutExpert secrets not set — skipping the GutExpert pipeline."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Run pipeline
        if: steps.secrets.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHOPIFY_STORE_DOMAIN_GUTEXPERT: ${{ secrets.SHOPIFY_STORE_DOMAIN_GUTEXPERT }}
          SHOPIFY_CLIENT_ID_GUTEXPERT: ${{ secrets.SHOPIFY_CLIENT_ID_GUTEXPERT }}
          SHOPIFY_CLIENT_SECRET_GUTEXPERT: ${{ secrets.SHOPIFY_CLIENT_SECRET_GUTEXPERT }}
        run: npm run run
